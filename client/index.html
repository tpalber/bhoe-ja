<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bhoe Ja - All the latest Tibetan news in one place"
    />
    <title>Bhoe Ja</title>
    <script>
      // Apply persisted dark mode before first paint (avoids flash).
      try {
        var m = JSON.parse(localStorage.getItem('BhoejaDarkMode') || '{}');
        if (m.darkMode) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
